version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ies-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ies_user
      POSTGRES_PASSWORD: ies_password
      POSTGRES_DB: ies_vc_issuer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ies_user -d ies_vc_issuer"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
